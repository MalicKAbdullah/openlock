name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        # Runs after the APK build so local.properties (flutter.sdk) exists.
        # Compiles the Kotlin test sources and the main sources they exercise.
        run: ./gradlew :app:testDebugUnitTest
