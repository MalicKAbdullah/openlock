name: openlock
description: OpenLock — an offline, open-source app lock that guards your apps behind a PIN, pattern, or fingerprint, with device-admin uninstall protection.
publish_to: none
version: 1.9.0+11

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  package_info_plus: ^8.0.0

  # Navigation
  go_router: ^14.2.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3

  # Cross-language PIN verifier hashing (PBKDF2-HMAC-SHA256, mirrored in Kotlin)
  cryptography: ^2.7.0

  # Biometric unlock
  local_auth: ^2.3.0

  # Direct platform dep — di.dart constructs FlutterSecureStorage
  flutter_secure_storage: ^9.2.2

  # Shared foundation, pulled from the secure-suite-core repository.
  # (Local development uses pubspec_overrides.yaml to resolve these by path.)
  core_crypto:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_crypto
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_storage:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_storage
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_lock:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_lock
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_security:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_security
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_theme:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_theme
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_ui:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_ui
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_update:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_update
      ref: 3e90d1221ef1e4010748944c83459df13d18c205

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1
  # Tests seed the appearance preference with setMockInitialValues.
  shared_preferences: ^2.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#007E9C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png

flutter_native_splash:
  color: "#F6F7F9"
  color_dark: "#0A0C10"
  image: assets/brand/splash-tile.png
  branding: assets/brand/offlyne-endorsement.png
  branding_dark: assets/brand/offlyne-endorsement-white.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#007E9C"
    icon_background_color_dark: "#007E9C"
    color: "#F6F7F9"
    color_dark: "#0A0C10"
    branding: assets/brand/offlyne-endorsement.png
    branding_dark: assets/brand/offlyne-endorsement-white.png

flutter:
  uses-material-design: true
